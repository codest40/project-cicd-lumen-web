<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask APP Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Dashboad Panel</h1>
    </header>

    <main>
        <section>
            <h1>Get Random Jokes</h1>
            <button id="api-test">Click Here</button>
            <div id="api-result"></div>
        </section>

        <hr>

        <!-- New Section: Search for a name -->
        <section>
            <h2>Search for a celebrity's Name</h2>
            <form id="search-form" action="/api-search">
                <label for="name">Enter Name:</label>
                <input type="text" id="name" name="name" placeholder="Type a name..." required>
                <button type="submit">Search</button>
            </form>

            <!-- Placeholder for search results -->
            <div id="search-result">
                {% if result %}
                    <p><strong>Result:</strong> {{ result }}</p>
                {% endif %}
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
